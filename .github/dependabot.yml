# Weekly dependency updates, grouped so minor/patch bumps arrive as one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /core
    schedule: { interval: weekly, day: monday }
    groups:
      cargo-minor: { update-types: [minor, patch] }
    labels: ["area: core", "dependencies"]
    # Arrow is pinned to the major version pyo3-arrow supports; bump both together by hand.
    ignore:
      - dependency-name: arrow
        update-types: ["version-update:semver-major"]
      - dependency-name: parquet
        update-types: ["version-update:semver-major"]
      - dependency-name: pyo3-arrow
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /api
    schedule: { interval: weekly, day: monday }
    groups:
      python-minor: { update-types: [minor, patch] }
    labels: ["area: api", "dependencies"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor: { update-types: [minor, patch] }
    labels: ["area: web", "dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: ["area: ci", "dependencies"]
  - package-ecosystem: docker
    directories: [/api, /web, /deploy]
    schedule: { interval: weekly, day: monday }
    labels: ["area: deploy", "dependencies"]
    # Node majors are taken by hand on the LTS cadence (25+ dropped Corepack); the
    # TimescaleDB image is pinned by digest and bumped with a migration check.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: timescale/timescaledb
        update-types: ["version-update:semver-major"]
