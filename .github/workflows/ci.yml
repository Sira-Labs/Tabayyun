name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: rust core
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: core }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run -q --bin tabayyun -- synth --out /tmp/f.csv --faults gap,flatline,nans
      - run: cargo run -q --bin tabayyun -- run --input /tmp/f.csv --quality-col quality --unit "%" | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['findings'], 'expected findings'; print(r['score'])"
      - name: audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  api:
    name: python api
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: api }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run --with pip-audit pip-audit --skip-editable || true

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit --audit-level high || true
