name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: rust core
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: core }
    # RustFS for the cache's S3 test (spec 006); throwaway test credentials.
    services:
      rustfs:
        image: rustfs/rustfs:1.0.0
        env: { RUSTFS_ACCESS_KEY: tabayyun-ci, RUSTFS_SECRET_KEY: tabayyun-ci-secret }
        ports: ["9000:9000"]
    env:
      TABAYYUN_TEST_S3_URL: s3://tabayyun-test
      TABAYYUN_TEST_S3_ENDPOINT: http://localhost:9000
      TABAYYUN_TEST_S3_ACCESS_KEY_ID: tabayyun-ci
      TABAYYUN_TEST_S3_SECRET_ACCESS_KEY: tabayyun-ci-secret
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Create the S3 test bucket
        env: { AWS_ACCESS_KEY_ID: tabayyun-ci, AWS_SECRET_ACCESS_KEY: tabayyun-ci-secret, AWS_DEFAULT_REGION: us-east-1 }
        run: |
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:9000/health/ready && break; [ "$i" = 60 ] && { echo 'RustFS not ready after 60 s'; exit 1; }; sleep 1; done
          aws --endpoint-url http://localhost:9000 s3 mb s3://tabayyun-test
      - run: cargo test
      - run: cargo run -q --bin tabayyun -- synth --out /tmp/f.csv --faults gap,flatline,nans
      - run: cargo run -q --bin tabayyun -- run --input /tmp/f.csv --quality-col quality --unit "%" | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['findings'], 'expected findings'; print(r['score'])"
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  bindings:
    name: python bindings
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: core/tabayyun-py }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python -m venv .venv && . .venv/bin/activate && pip install maturin pytest "pyarrow>=17" "polars>=1.2"
      - run: . .venv/bin/activate && maturin develop --release
      - run: . .venv/bin/activate && pytest -q

  api:
    name: python api
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: api }
    services:
      postgres:
        image: timescale/timescaledb:2.30.1-pg17
        env:
          POSTGRES_USER: tabayyun
          POSTGRES_PASSWORD: tabayyun
          POSTGRES_DB: tabayyun
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tabayyun"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      rustfs:
        image: rustfs/rustfs:1.0.0
        env: { RUSTFS_ACCESS_KEY: tabayyun-ci, RUSTFS_SECRET_KEY: tabayyun-ci-secret }
        ports: ["9000:9000"]
    env:
      TABAYYUN_DATABASE_URL: postgresql+psycopg://tabayyun:tabayyun@localhost:5432/tabayyun
      TABAYYUN_TEST_DATABASE_URL: postgresql+psycopg://tabayyun:tabayyun@localhost:5432/tabayyun
      TABAYYUN_TEST_S3_URL: s3://tabayyun-test
      TABAYYUN_TEST_S3_ENDPOINT: http://localhost:9000
      TABAYYUN_TEST_S3_ACCESS_KEY_ID: tabayyun-ci
      TABAYYUN_TEST_S3_SECRET_ACCESS_KEY: tabayyun-ci-secret
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Create the S3 test bucket
        env: { AWS_ACCESS_KEY_ID: tabayyun-ci, AWS_SECRET_ACCESS_KEY: tabayyun-ci-secret, AWS_DEFAULT_REGION: us-east-1 }
        run: |
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:9000/health/ready && break; [ "$i" = 60 ] && { echo 'RustFS not ready after 60 s'; exit 1; }; sleep 1; done
          aws --endpoint-url http://localhost:9000 s3 mb s3://tabayyun-test
      - run: uv run pytest -q
      # Models and migrations must agree; the tests leave the schema at head.
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run --with pip-audit pip-audit --skip-editable || true

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm audit --audit-level high || true
