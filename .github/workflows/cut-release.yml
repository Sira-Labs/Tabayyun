name: cut release

# Publishes a version of main (ADR-0017): tags the commit, creates the GitHub release with notes
# from the merged pull requests, and emails it. Run by Claude Code or the owner: Actions → cut
# release → Run workflow on main.
#   patch  a finished spec or a set of fixes
#   minor  a finished sprint (a stable minor or major release gets slides and a review meeting)
#   major  a product milestone, decided by the owner
# The v* tag then builds versioned images and deploys them to staging (release.yml);
# production is promoted separately (promote.yml).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch (a spec or fixes), minor (a sprint) or major (a milestone)"
        type: choice
        options: [patch, minor, major]
        default: patch
      prerelease:
        description: "A release candidate (vX.Y.Z-rc.N)"
        type: boolean
        default: false

permissions:
  contents: read
  # The check that release.yml deployed this commit to staging.
  actions: read
  # The release mail reads the titles of the pull requests it lists.
  pull-requests: read

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  release:
    name: cut release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: next version
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: .github/scripts/next-version.sh
      - name: something to release, and live on staging
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.version.outputs.prev }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$PREV" ] && [ "$(git rev-list --count "$PREV..$SHA")" = "0" ]; then
            echo "::error::nothing to release: main has not changed since $PREV"
            exit 1
          fi
          # A successful run is not enough: a run skips the deploy when staging is not set up.
          # Only a push run on main whose live check passed shows that staging runs this commit.
          ok=0
          while read -r run_id; do
            live=$(gh run view "$run_id" --json jobs --jq 'any(.jobs[]?; .name == "deploy to staging" and any(.steps[]?; .name == "wait until the new version is live" and .conclusion == "success"))')
            if [ "$live" = "true" ]; then ok=1; break; fi
          done < <(gh run list --workflow release.yml --branch main --event push --commit "$SHA" --status success --json databaseId --jq '.[].databaseId')
          if [ "$ok" = "0" ]; then
            echo "::error::staging has not been confirmed to run $SHA (release.yml's live check): release what staging runs"
            exit 1
          fi
      - name: tag and publish
        id: publish
        env:
          # The owner's token: a tag pushed with GITHUB_TOKEN would start no workflow, and only
          # organisation admins may create v* tags (protect-release-tags).
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          PREV: ${{ steps.version.outputs.prev }}
          SHA: ${{ github.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
          REUSED: ${{ steps.version.outputs.reused }}
        # A re-run after a failure here reuses the tag already at SHA (next-version.sh) and
        # only creates what is still missing.
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::AUTOMATION_TOKEN is not set (deploy/caprover.md, section 5)"; exit 1; fi
          if [ "$REUSED" = "true" ]; then
            echo "::notice::$TAG already points at $SHA: not tagged again"
          else
            git tag "$TAG" "$SHA"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/tags/$TAG"
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::the release $TAG exists already"
          else
            args=(--verify-tag --title "Tabayyun $TAG" --generate-notes)
            if [ -n "$PREV" ]; then args+=(--notes-start-tag "$PREV"); fi
            if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease --latest=false); fi
            gh release create "$TAG" --repo "$REPO" "${args[@]}"
          fi
          echo "url=$(gh release view "$TAG" --repo "$REPO" --json url --jq .url)" >> "$GITHUB_OUTPUT"
          echo "Published [$TAG]($(gh release view "$TAG" --repo "$REPO" --json url --jq .url))" >> "$GITHUB_STEP_SUMMARY"
      - name: email the release
        continue-on-error: true
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREV: ${{ steps.version.outputs.prev }}
          WANT: ${{ github.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
          REVIEW: ${{ steps.version.outputs.review }}
          RELEASE_URL: ${{ steps.publish.outputs.url }}
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SHIP_MAIL_TO: ${{ vars.SHIP_MAIL_TO }}
        run: .github/scripts/release-mail.py
