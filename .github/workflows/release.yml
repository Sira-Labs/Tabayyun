name: release

# Builds the production images on every push to main and on version tags, scans them with
# Trivy, publishes them to the GitHub Container Registry, and (optionally) deploys them.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # GHCR names must be lowercase; github.repository_owner is "Sira-Labs", so the organisation
  # is spelled out here.
  IMAGE_PREFIX: ghcr.io/sira-labs/tabayyun
  # Pinned by digest, run as a plain container on a saved image file: no third-party action
  # sees the registry token, and the scanner gets no Docker socket.
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  images:
    name: build and publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      # Pushed by digest only: the image is in GHCR but has no tag yet, so no deploy can pick
      # it up before the scan below has passed.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reported by /api/version and the web image's /version.json after a deploy.
          build-args: TABAYYUN_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true
      # Scans exactly the pushed image, saved to a file: the scanner gets no Docker socket.
      - name: Trivy scan (fixable critical CVEs fail the job)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull -q "$IMAGE"
          docker tag "$IMAGE" scan/image:ci
          mkdir -p "$RUNNER_TEMP/scan"
          docker save scan/image:ci -o "$RUNNER_TEMP/scan/image.tar"
          docker run --rm -v "$RUNNER_TEMP/scan:/scan:ro" -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --quiet --exit-code 1 --severity CRITICAL --ignore-unfixed \
            --input /scan/image.tar
      # Only a scanned image gets tags; every tag points at that digest, attestations included.
      - name: tag the scanned image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          META: ${{ steps.meta.outputs.json }}
        run: |
          # shellcheck disable=SC2046 # one "-t <tag>" pair per tag
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META") "$IMAGE"

  deploy:
    name: deploy to docker host
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Environment-scoped variables are only visible once the environment is bound, i.e. inside
    # steps; a job-level `if` cannot see them. Every step therefore carries the gate.
    environment: production
    steps:
      - name: configured?
        id: gate
        run: |
          if [ -n "${{ vars.DEPLOY_HOST }}" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "on=false" >> "$GITHUB_OUTPUT"; echo "DEPLOY_HOST not set on environment 'production'; skipping deploy"; fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.on == 'true'
      - name: copy compose bundle
        if: steps.gate.outputs.on == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/compose.yaml"
          target: "~/tabayyun"
          strip_components: 1
      - name: pull and restart
        if: steps.gate.outputs.on == 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          TABAYYUN_TAG: ${{ needs.images.outputs.tag }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TABAYYUN_TAG
          script: |
            set -euo pipefail
            cd ~/tabayyun
            export TABAYYUN_TAG
            echo "deploying image tag $TABAYYUN_TAG"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f compose.yaml pull
            docker compose -f compose.yaml up -d --remove-orphans
            docker image prune -f

  deploy-caprover:
    name: deploy to CapRover
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Runs only when the repository variable CAPROVER_SERVER is set (Settings → Secrets and
    # variables → Actions → Variables) and the two app tokens exist as secrets.
    steps:
      - name: configured?
        id: gate
        env:
          WORKER_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN_WORKER }}
        run: |
          if [ -n "${{ vars.CAPROVER_SERVER }}" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "on=false" >> "$GITHUB_OUTPUT"; echo "CAPROVER_SERVER not set; skipping CapRover deploy"; fi
          # The worker app is optional until it exists: deployed only when its token is set.
          if [ -n "$WORKER_TOKEN" ]; then echo "worker=true" >> "$GITHUB_OUTPUT"; else echo "worker=false" >> "$GITHUB_OUTPUT"; echo "CAPROVER_APP_TOKEN_WORKER not set; skipping worker deploy"; fi
      - name: deploy api
        if: steps.gate.outputs.on == 'true'
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ vars.CAPROVER_SERVER }}
          app: ${{ vars.CAPROVER_APP_API || 'tabayyun-api' }}
          token: ${{ secrets.CAPROVER_APP_TOKEN_API }}
          image: ${{ env.IMAGE_PREFIX }}-api:${{ needs.images.outputs.tag }}
      - name: deploy web
        if: steps.gate.outputs.on == 'true'
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ vars.CAPROVER_SERVER }}
          app: ${{ vars.CAPROVER_APP_WEB || 'tabayyun-web' }}
          token: ${{ secrets.CAPROVER_APP_TOKEN_WEB }}
          image: ${{ env.IMAGE_PREFIX }}-web:${{ needs.images.outputs.tag }}
      - name: deploy worker
        if: steps.gate.outputs.on == 'true' && steps.gate.outputs.worker == 'true'
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ vars.CAPROVER_SERVER }}
          app: ${{ vars.CAPROVER_APP_WORKER || 'tabayyun-worker' }}
          token: ${{ secrets.CAPROVER_APP_TOKEN_WORKER }}
          image: ${{ env.IMAGE_PREFIX }}-api:${{ needs.images.outputs.tag }}
      # CapRover accepts a deploy before it pulls the image, so a failed pull (a private package,
      # a wrong name) or a container that never starts would otherwise leave this job green.
      # Waits until the public URL serves this commit from both the web and the api image.
      # The worker has no HTTP endpoint; it runs the api image, so a pulled api image covers it.
      - name: wait until the new version is live
        if: steps.gate.outputs.on == 'true'
        env:
          URL: ${{ vars.CAPROVER_WEB_URL }}
          WANT: ${{ github.sha }}
        run: |
          if [ -z "$URL" ]; then echo "::notice::CAPROVER_WEB_URL not set; not checking that the deploy went live"; exit 0; fi
          URL="${URL%/}"
          deadline=$((SECONDS + 600))
          while :; do
            web=$(curl -fsS -m 10 "$URL/version.json" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)
            api=$(curl -fsS -m 10 "$URL/api/version" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$web" = "$WANT" ] && [ "$api" = "$WANT" ]; then echo "web and api run $WANT"; exit 0; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::after 10 minutes $URL serves web '${web:-?}' and api '${api:-?}', not $WANT; see the apps' deployment logs in CapRover"
              exit 1
            fi
            sleep 15
          done
