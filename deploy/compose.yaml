# Production bundle: images published by .github/workflows/release.yml.
#   cp .env.example .env   # fill secrets, choose TABAYYUN_TAG
#   docker compose -f deploy/compose.yaml up -d
# TABAYYUN_TAG is required: manual installs set a version or a sha-<short> tag. promote.yml
# instead sets TABAYYUN_API_IMAGE and TABAYYUN_WEB_IMAGE to the digest-pinned images staging
# ran (ADR-0016); when set they take precedence over the tag.
services:
  web:
    image: ${TABAYYUN_WEB_IMAGE:-ghcr.io/sira-labs/tabayyun-web:${TABAYYUN_TAG:?set TABAYYUN_TAG (a version or sha-<short>)}}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TABAYYUN_DOMAIN: ${TABAYYUN_DOMAIN:-}
    volumes:
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${TABAYYUN_API_IMAGE:-ghcr.io/sira-labs/tabayyun-api:${TABAYYUN_TAG:?set TABAYYUN_TAG (a version or sha-<short>)}}
    restart: unless-stopped
    env_file: .env
    # The image migrates the schema (python -m tabayyun.db.migrate upgrade head) on every start
    # before serving: as the table owner, which then provisions the app login the api and the
    # worker run as (tabayyun_app, row-level security, spec 007).
    environment:
      TABAYYUN_ENV: prod
      TABAYYUN_MIGRATION_DATABASE_URL: postgresql+psycopg://tabayyun:${POSTGRES_PASSWORD}@postgres:5432/tabayyun
      TABAYYUN_DATABASE_URL: postgresql+psycopg://tabayyun_app:${TABAYYUN_APP_DB_PASSWORD:?set TABAYYUN_APP_DB_PASSWORD in .env}@postgres:5432/tabayyun
      TABAYYUN_TIMESCALE: ${TABAYYUN_TIMESCALE:-auto}
    volumes:
      - cache:/data/cache
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    # Same image and environment as the api; TABAYYUN_ROLE=worker runs the job worker
    # instead of the server. Scale with `docker compose up -d --scale worker=2`.
    image: ${TABAYYUN_API_IMAGE:-ghcr.io/sira-labs/tabayyun-api:${TABAYYUN_TAG:?set TABAYYUN_TAG (a version or sha-<short>)}}
    restart: unless-stopped
    env_file: .env
    environment:
      TABAYYUN_ENV: prod
      TABAYYUN_ROLE: worker
      TABAYYUN_DATABASE_URL: postgresql+psycopg://tabayyun_app:${TABAYYUN_APP_DB_PASSWORD:?set TABAYYUN_APP_DB_PASSWORD in .env}@postgres:5432/tabayyun
      TABAYYUN_TIMESCALE: ${TABAYYUN_TIMESCALE:-auto}
    volumes:
      - cache:/data/cache
    depends_on:
      api:
        condition: service_healthy

  postgres:
    # Pinned: `docker compose pull` runs on every deployment, and a moving tag would swap
    # the database binaries under a persistent data directory. Bump deliberately.
    image: timescale/timescaledb:2.30.1-pg17@sha256:c79fa5891443d1cdf6de5258d4c2bdb8cde29052c45df2062b13d351e0202005
    restart: unless-stopped
    environment:
      POSTGRES_USER: tabayyun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tabayyun
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabayyun"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  cache:
  caddy_data:
