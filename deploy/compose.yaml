# Production bundle: images published by .github/workflows/release.yml.
#   cp .env.example .env   # fill secrets
#   docker compose -f deploy/compose.yaml up -d
services:
  web:
    image: ghcr.io/thedatadudech/tabayyun-web:${TABAYYUN_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TABAYYUN_DOMAIN: ${TABAYYUN_DOMAIN:-}
    volumes:
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ghcr.io/thedatadudech/tabayyun-api:${TABAYYUN_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      TABAYYUN_ENV: prod
      TABAYYUN_DATABASE_URL: postgresql+psycopg://tabayyun:${POSTGRES_PASSWORD}@postgres:5432/tabayyun
    volumes:
      - cache:/data/cache
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tabayyun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tabayyun
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabayyun"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  cache:
  caddy_data:
