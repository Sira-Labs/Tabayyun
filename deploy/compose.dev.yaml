# Development infrastructure only: Postgres with TimescaleDB, Keycloak and RustFS (S3).
# The API and web run on the host (make api-dev / make web-dev). Production bundles add
# api, worker and caddy services; see docs/architecture/03-system-architecture.md.
services:
  postgres:
    image: timescale/timescaledb:2.30.1-pg17
    environment:
      POSTGRES_USER: tabayyun
      POSTGRES_PASSWORD: tabayyun   # dev only; prod uses secrets
      POSTGRES_DB: tabayyun
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabayyun"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin   # dev only
      KC_DB: dev-file
    ports: ["8080:8080"]

  # S3-compatible store for the Parquet cache (spec 006), same version as the live system.
  # Create the bucket once: `make dev-bucket`. Dev credentials only.
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: tabayyun-dev
      RUSTFS_SECRET_KEY: tabayyun-dev-secret   # dev only
    # Localhost only: the credentials below are committed dev values.
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["rustfsdata:/data"]

volumes:
  pgdata:
  rustfsdata:
