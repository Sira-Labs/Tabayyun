[package]
name = "tabayyun-cli"
description = "Tabayyun command line: run checks on CSV/Parquet files, generate synthetic data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tabayyun"
path = "src/main.rs"

[dependencies]
tabayyun-core = { path = "../tabayyun-core" }
arrow = { workspace = true }
# Input files come from anywhere, so the CLI reads every codec pyarrow writes; the core and
# the wheel only read the cache's own zstd parts and keep the workspace set.
parquet = { workspace = true, features = ["brotli", "lz4", "flate2-zlib-rs"] }
clap = { workspace = true }
csv = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
