[package]
name = "tabayyun-py"
description = "Python bindings for tabayyun-core (Arrow PyCapsule interface, zero-copy)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_native"
