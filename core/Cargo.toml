[workspace]
resolver = "2"
members = ["tabayyun-core", "tabayyun-cli", "tabayyun-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Sira-Labs/Tabayyun"

[workspace.dependencies]
arrow = { version = "59", default-features = false }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
proptest = "1"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
pyo3-arrow = "0.19"
# The cache reads Parquet from fetched bytes, so object_store is not tied to parquet's version.
# 0.14.1+ uses quick-xml 0.41 (RUSTSEC-2026-0194/0195 fixed).
object_store = { version = "0.14.2", default-features = false, features = ["fs", "aws"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
futures = "0.3"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
