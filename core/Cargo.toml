[workspace]
resolver = "2"
members = ["tabayyun-core", "tabayyun-cli", "tabayyun-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/thedatadudech/Tabayyun"

[workspace.dependencies]
arrow = { version = "59", default-features = false }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
proptest = "1"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
pyo3-arrow = "0.19"

[profile.release]
lto = "thin"
codegen-units = 1
